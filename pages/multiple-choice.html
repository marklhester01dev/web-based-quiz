<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <meta name="author" content="Mark Lhester Pile" />
    <meta
      name="description"
      content="A web-based quiz mini-project that are composed of multiple quiz types"
    />

    <!-- Open Graphs -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:title" content="Web-based Quiz - Multiple Choice" />
    <meta
      property="og:description"
      content="Test your knowledge with a 20-item multiple choice quiz with four options per question and only one right answer."
    />
    <meta
      property="og:image"
      content="../assets/icons/logo/interactive-quiz-illustration-svg-download-png-14962188.webp"
    />

      property="og:image:alt"
      content="Preview screenshot of the Web-based Quiz app"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Web-based Quiz - Multiple Choice Quiz"
    />
    <meta
      name="twitter:description"
      content="Test your knowledge with a 20-item multiple choice quiz with four options per question and only one right answer."
    />
    <meta
      name="twitter:image"
      content="../assets/icons/logo/interactive-quiz-illustration-svg-download-png-14962188.webp"
    />
    <meta
      name="twitter:image:alt"
      content="Preview screenshot of the Web-based Quiz app"
    />

    <!-- Favicon -->
    <link
      rel="shortcut icon"
      href="../assets/icons/logo/interactive-quiz-illustration-svg-download-png-14962188.webp"
      type="image/x-icon"
      sizes="32x32"
    />

    <!-- Phosphor Icons -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/general.css" />
    <link rel="stylesheet" href="../css/quiz-mode-choices.css" />

    <!-- Scripts -->
    <script src="../js/components/quiz-form-choices.js" defer></script>
    <script src="../js/multiple-choice.js" defer></script>
    <title>Multiple Choice | Web-based Quiz</title>
  </head>
  <body>
    <main>
      <section class="category-choice">
        <div class="category-choice__container">
          <h1 class="category-choice__title" tabindex="0">Multiple Choice</h1>
          <p class="category-choice__description" tabindex="0">
            <span class="category-choice__instruction">Instruction:</span>
            Select the correct answer from the options provided for every item
            and see how well you do. Good luck!
          </p>
        </div>
      </section>

      <!-- Multiple Choice Form -->
      <quiz-form id="quiz"></quiz-form>
      <!-- Multiple Choice Form -->
    </main>
  </body>
</html>
