    <meta charset="UTF-8" />

      property="og:description"

    <meta
      property="og:image"
      content="../assets/icons/logo/interactive-quiz-illustration-svg-download-png-14962188.webp"
    />

      content="Preview screenshot of the Web-based Quiz app"
    />

    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Web-based Quiz" />
    <meta
      name="twitter:description"
      content="A web-based quiz mini-project that is composed of multiple quiz types"
    />
    <meta
      name="twitter:image"
      content="../assets/icons/logo/interactive-quiz-illustration-svg-download-png-14962188.webp"
    />
    <meta
      name="twitter:image:alt"
      content="Preview screenshot of the Web-based Quiz app"
    />

    <!-- Favicon -->
    <link
      rel="shortcut icon"
      href="../assets/icons/logo/interactive-quiz-illustration-svg-download-png-14962188.webp"
      type="image/x-icon"
      sizes="32x32"
    />

    <!-- Phosphor Icons -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/general.css" />

    <!-- Scripts -->
    <script src="../js/multiple-choice-redirection.js"></script>
    <title>Web-based Quiz</title>
  </head>
  <body>
    <main>
      <section class="multiple-choice">
        <div class="multiple-choice__container">
          <h1 class="multiple-choice__title">Multiple Choice Quiz</h1>
          <p class="multiple-choice__description">
            <span class="multiple-choice__instruction">Instruction:</span>
            Select the correct answer from the options provided for every item
            and see how well you do. Good luck!
          </p>
        </div>
      </section>

      <form class="multiple-choice__form" id="quiz-form">
        <article class="multiple-choice__question" data-question-id="1">
          <h2 id="q1-label" class="multiple-choice__question-text">
            Which planet is known as the Red Planet?
          </h2>

          <!-- Multiple Choice Wrapper -->
          <div
            class="multiple-choice__options"
            role="radiogroup"
            aria-labelledby="q1-label"
          >
            <!-- Choice Container -->
            <div class="multiple-choice__option">
              <input
                type="radio"
                id="q1-option1"
                name="question1"
                value="a"
                class="multiple-choice__input"
              />
              <label for="q1-option1" class="multiple-choice__label"
                >Earth</label
              >
            </div>

            <!-- Choice Container -->
            <div class="multiple-choice__option">
              <input
                type="radio"
                id="q1-option2"
                name="question1"
                value="b"
                class="multiple-choice__input"
              />
              <label for="q1-option2" class="multiple-choice__label"
                >Mars</label
              >
            </div>

            <!-- Choice Container -->
            <div class="multiple-choice__option">
              <input
                type="radio"
                id="q1-option3"
                name="question1"
                value="c"
                class="multiple-choice__input"
              />
              <label for="q1-option3" class="multiple-choice__label"
                >Venus</label
              >
            </div>

            <!-- Choice Container -->
            <div class="multiple-choice__option">
              <input
                type="radio"
                id="q1-option4"
                name="question1"
                value="d"
                class="multiple-choice__input"
              />
              <label for="q1-option4" class="multiple-choice__label"
                >Jupiter</label
              >
            </div>
          </div>
          <!-- Multiple Choice Wrapper -->
        </article>

        <button type="submit" class="multiple-choice__btn">
          <span class="multiple-choice__next">Next</span>
          <i class="ph ph-arrow-right"></i>
        </button>
      </form>
    </main>
  </body>
</html>
