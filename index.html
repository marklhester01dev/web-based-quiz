<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <meta name="author" content="Mark Lhester Pile" />
    <meta
      name="description"
      content="A web-based quiz mini-project that are composed of multiple quiz types"
    />

    <!-- Open Graphs -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:title" content="Web-based Quiz" />
    <meta
      property="og:description"
      content="A web-based quiz mini-project that is composed of multiple quiz types"
    />
    <meta
      property="og:image"
      content="assets/icons/logo/interactive-quiz-illustration-svg-download-png-14962188.webp"
    />
    <meta
      property="og:image:alt"
      content="Preview screenshot of the Web-based Quiz app"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Web-based Quiz" />
    <meta
      name="twitter:description"
      content="A web-based quiz mini-project that is composed of multiple quiz types"
    />
    <meta
      name="twitter:image"
      content="assets/icons/logo/interactive-quiz-illustration-svg-download-png-14962188.webp"
    />
    <meta
      name="twitter:image:alt"
      content="Preview screenshot of the Web-based Quiz app"
    />

    <link
      rel="shortcut icon"
      href="assets/icons/logo/interactive-quiz-illustration-svg-download-png-14962188.webp"
      type="image/x-icon"
      sizes="32x32"
    />

    <!-- Phosphor Icons -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <!-- Phosphor Icons -->

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/quiz-selection.css" />

    <!-- Scripts -->
    <script src="js/components/category-cards.js" defer></script>

    <title>Web-based Quiz</title>
  </head>
  <body>
    <main>
      <div class="hero">
        <h1 class="hero__title" tabindex="0">Quizzy</h1>
        <p class="hero__subtitle" tabindex="0">Challenge what you know.</p>
      </div>

      <div class="section-heading" tabindex="0">
        <h2 class="section-heading__title">Choose Category</h2>
      </div>

      <!-- container -->
      <section class="category-list">
        <!-- wrapper -->
        <div class="category-list__wrapper">
          <!-- Multiple Choice Category -->
          <category-card
            card-title="Multiple Choice"
            items="20 Items"
            options="4 Options per Question"
            time="~10 min"
            link="pages/multiple-choice.html"
          >
          </category-card>
          <!-- Multiple Choice Category -->

          <!-- True or False Category -->
          <category-card
            card-title="True or False"
            items="20 Items"
            options="2 Options per Question"
            time="~7 min"
            link="pages/true-false.html"
          >
          </category-card>
          <!-- True or False Category -->

          <!-- Identification Category -->
          <category-card
            card-title="Identification"
            items="20 Items"
            options="Free Response"
            time="~12 min"
            link="pages/identification.html"
          >
          </category-card>
          <!-- Identification Category -->

          <!-- Enumeration Category -->
          <category-card
            card-title="Enumeration"
            items="20 Items"
            options="Multiple Answers per Item"
            time="~25 min"
            link="pages/enumeration.html"
          >
          </category-card>
          <!-- Enumeration Category -->
        </div>
        <!-- wrapper -->
      </section>
      <!-- container -->
    </main>
  </body>
</html>
