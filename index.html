    <meta property="og:url" content="" />

      property="og:description"
      content="A web-based quiz mini-project that is composed of multiple quiz types"
    />
    <meta
      property="og:image"
      content="assets/icons/logo/interactive-quiz-illustration-svg-download-png-14962188.webp"
    />

      content="Preview screenshot of the Web-based Quiz app"
    />

    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Web-based Quiz" />
    <meta
      name="twitter:description"
      content="A web-based quiz mini-project that is composed of multiple quiz types"
    />
    <meta
      name="twitter:image"
      content="assets/icons/logo/interactive-quiz-illustration-svg-download-png-14962188.webp"
    />
    <meta
      name="twitter:image:alt"
      content="Preview screenshot of the Web-based Quiz app"
    />

    <link
      rel="shortcut icon"
      href="assets/icons/logo/interactive-quiz-illustration-svg-download-png-14962188.webp"
      type="image/x-icon"
      sizes="32x32"
    />

    <!-- Phosphor Icons -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <!-- Phosphor Icons -->

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/general.css" />

    <!-- Scripts -->
    <script src="js/components/category_cards.js" defer></script>

    <title>Web-based Quiz</title>
  </head>
  <body>
    <main>
      <div class="hero">
        <h1 class="hero__title">Quizzy</h1>
        <p class="hero__subtitle">Challenge what you know.</p>
      </div>

      <div class="section-heading">
        <h2 class="section-heading__title">Choose Category</h2>
      </div>

      <!-- container -->
      <section class="category-list">
        <!-- wrapper -->
        <div class="category-list__wrapper">
          <!-- Multiple Choice Category -->
          <category-card
            card-title="Multiple Choice"
            description="Sharpen your recall and put your knowledge to the test! Choose the right answer from four options and see how many you can nail."
            items="20 Items"
            options="4 Options per Question"
            time="~10 min"
            link="pages/multiple-choice.html"
          >
          </category-card>
          <!-- Multiple Choice Category -->

          <!-- Identification Category -->
          <category-card
            card-title="Identification"
            description="Put your memory to the test! Type in the correct answer for each question without any options to guide you."
            items="20 Items"
            options="Free Response"
            time="~12 min"
            link="pages/identification.html"
          >
          </category-card>
          <!-- Identification Category -->

          <!-- Enumeration Category -->
          <category-card
            card-title="Enumeration"
            description="List them all! Recall and type out every item that belongs to each question's set to earn full credit."
            items="15 Items"
            options="Multiple Answers per Item"
            time="~15 min"
            link="pages/enumeration.html"
          >
          </category-card>
          <!-- Enumeration Category -->

          <!-- True or False Category -->
          <category-card
            card-title="True or False"
            description="Test your judgment! Decide whether each statement is true or false and see how sharp your instincts really are."
            items="20 Items"
            options="2 Options per Question"
            time="~7 min"
            link="pages/true-false.html"
          >
          </category-card>
          <!-- True or False Category -->
        </div>
        <!-- wrapper -->
      </section>
      <!-- container -->
    </main>
  </body>
</html>
